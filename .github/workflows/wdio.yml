name: 🧪 WebdriverIO Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.12.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run WDIO tests
      env:
            API_USERNAME: ${{ secrets.API_USERNAME }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            API_URL: ${{ secrets.API_URL }}
            API_INVUSERNAME: ${{ secrets.API_INVUSERNAME }}
            API_INVPASSWORD: ${{ secrets.API_INVPASSWORD }}
            API_INVURL: ${{ secrets.API_INVURL }}
      run: npm run test
